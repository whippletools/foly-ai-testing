name: Playwright Tests + Allure Report
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Permisos para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Configuración de GitHub Pages
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Auth Setup (login)
      run: npx playwright test --project=setup tests/auth.setup.ts
      env:
        FOLY_LOGIN_USER: ${{ secrets.FOLY_LOGIN_USER }}
        FOLY_LOGIN_PASS: ${{ secrets.FOLY_LOGIN_PASS }}
        FOLY_LOGIN_OTP: ${{ secrets.FOLY_LOGIN_OTP }}
        BASE_URL: ${{ secrets.BASE_URL || 'https://erpfoly.vercel.app' }}

    - name: Run Playwright tests
      run: npx playwright test
      env:
        FOLY_LOGIN_USER: ${{ secrets.FOLY_LOGIN_USER }}
        FOLY_LOGIN_PASS: ${{ secrets.FOLY_LOGIN_PASS }}
        FOLY_LOGIN_OTP: ${{ secrets.FOLY_LOGIN_OTP }}
        BASE_URL: ${{ secrets.BASE_URL || 'https://erpfoly.vercel.app' }}

    - name: Generate Allure Report
      if: always()
      run: |
        npx allure generate allure-results --single-file --clean -o allure-report

    - name: Upload Allure Report artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Upload Allure Report to GitHub Pages
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report/

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
